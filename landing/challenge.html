<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Join a challenge · Mood8</title>
<style>
  :root{
    --bg-deep:#0A0612; --bg-card:#1F1338; --purple:#A855F7; --purple-light:#C084FC;
    --pink:#EC4899; --pink-light:#F472B6; --blue:#818CF8; --ink:#FAF5FF;
    --ink-soft:#E9D5FF; --ink-dim:#A78BB8; --ink-faint:#6B5680;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg-deep); color:var(--ink); min-height:100vh;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
    background-image:radial-gradient(1200px 600px at 50% -10%, rgba(168,85,247,.22), transparent 60%);
  }
  .wrap{width:100%; max-width:440px}
  .card{
    background:linear-gradient(160deg, rgba(168,85,247,.14), rgba(31,19,56,.95));
    border:1px solid rgba(168,85,247,.30); border-radius:24px; padding:26px 22px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px;
    color:var(--pink-light);font-size:14px;margin-bottom:16px}
  .brand .dot{width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--purple),var(--pink))}
  h1{font-size:26px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.4px}
  .cat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--ink-soft);background:rgba(168,85,247,.18);
    border:1px solid rgba(168,85,247,.34);border-radius:20px;padding:4px 10px;margin-bottom:12px}
  .desc{color:var(--ink-soft);font-size:14.5px;line-height:1.55;margin:0 0 16px;white-space:pre-wrap}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .pill{background:rgba(255,255,255,.05);border:1px solid rgba(168,85,247,.28);
    border-radius:14px;padding:8px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .pill b{color:var(--ink)}
  input{width:100%;background:rgba(10,6,18,.6);border:1px solid rgba(168,85,247,.3);
    color:var(--ink);border-radius:14px;padding:13px 14px;font-size:15px;margin-bottom:12px;outline:none}
  input::placeholder{color:var(--ink-faint)}
  .btn{width:100%;border:none;cursor:pointer;border-radius:24px;padding:15px;font-size:15px;
    font-weight:800;color:#fff;background:linear-gradient(120deg,var(--purple-light),var(--pink-light),var(--blue));
    letter-spacing:.3px}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.secondary{background:transparent;border:1px solid rgba(168,85,247,.4);color:var(--ink-soft);margin-top:10px}
  .muted{color:var(--ink-dim);font-size:12.5px;text-align:center;margin-top:14px;line-height:1.5}
  .muted a{color:var(--pink-light);text-decoration:none;font-weight:700}
  .success .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 50% 40%, rgba(236,72,153,.85), rgba(168,85,247,.25));
    display:flex;align-items:center;justify-content:center;font-size:30px}
  .center{text-align:center}
  .err{color:var(--pink-light);font-size:14px;text-align:center;line-height:1.5}
  .spin{width:26px;height:26px;border:2.4px solid rgba(255,255,255,.25);
    border-top-color:var(--pink-light);border-radius:50%;animation:s .8s linear infinite;margin:30px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="brand"><span class="dot"></span> MOOD8 · CHALLENGE</div>
      <div id="loading"><div class="spin"></div></div>
      <div id="content" class="hidden"></div>
    </div>
  </div>

<script>
(function(){
  var API = "https://mood8.app/api";
  var token = decodeURIComponent((location.pathname.split("/c/")[1] || "").replace(/\/+$/,""));
  var loading = document.getElementById("loading");
  var content = document.getElementById("content");
  var challenge = null;

  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
  function show(html){loading.classList.add("hidden");content.classList.remove("hidden");content.innerHTML=html;}
  function fail(msg){show('<p class="err">'+esc(msg)+'</p><a class="btn secondary" href="https://mood8.app" style="display:block;text-decoration:none;text-align:center;margin-top:16px">Go to Mood8</a>');}
  function fmtDeadline(min){if(min==null)return"";var h=Math.floor(min/60),m=min%60;var ap=h<12?"AM":"PM";var hh=h%12;if(hh===0)hh=12;return hh+(m?":"+String(m).padStart(2,"0"):"")+" "+ap+" UTC";}

  if(!token){fail("This invite link looks incomplete.");return;}

  fetch(API+"/c/"+encodeURIComponent(token))
    .then(function(r){if(!r.ok)throw new Error(r.status===404?"This challenge isn't available anymore.":"Couldn't load the challenge.");return r.json();})
    .then(function(c){challenge=c;renderIntro(c);})
    .catch(function(e){fail(e.message||"Something went wrong.");});

  function renderIntro(c){
    var full = c.is_full;
    show(
      '<div class="cat">'+esc(c.category||"challenge")+'</div>'+
      '<h1>'+esc(c.title)+'</h1>'+
      (c.description?'<p class="desc">'+esc(c.description)+'</p>':'')+
      '<div class="meta">'+
        '<span class="pill"><b>'+esc(c.active_participants)+'</b> joined</span>'+
        '<span class="pill"><b>'+esc(c.duration_days)+'</b>-day</span>'+
        '<span class="pill"><b>'+esc(c.days_remaining)+'</b> days left</span>'+
      '</div>'+
      '<p class="muted" style="text-align:left;margin:0 0 14px">Check in once a day before '+
        esc(fmtDeadline(c.daily_deadline_minutes))+' to keep your rank climbing. Started by '+esc(c.creator_name)+'.</p>'+
      (full
        ? '<p class="err">This challenge is full.</p>'
        : '<input id="nm" maxlength="40" placeholder="Your name (optional)" />'+
          '<button class="btn" id="join">Join challenge</button>'+
          '<p class="muted">No account needed — you join as a guest. You can save your progress with a free Mood8 account later.</p>')
    );
    if(!full){
      document.getElementById("join").addEventListener("click", join);
      document.getElementById("nm").addEventListener("keydown",function(e){if(e.key==="Enter")join();});
    }
  }

  function join(){
    var btn=document.getElementById("join"); if(btn){btn.disabled=true;btn.textContent="Joining…";}
    var name=(document.getElementById("nm")||{}).value||"";
    fetch(API+"/c/"+encodeURIComponent(token)+"/join",{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({name:name})
    })
    .then(function(r){if(!r.ok)return r.json().then(function(b){throw new Error(b.detail||"Couldn't join.");});return r.json();})
    .then(function(res){
      try{localStorage.setItem("mood8_guest_token",res.token);}catch(e){}
      renderJoined(res);
    })
    .catch(function(e){if(btn){btn.disabled=false;btn.textContent="Join challenge";}alert(e.message||"Couldn't join.");});
  }

  function renderJoined(res){
    show(
      '<div class="success center">'+
        '<div class="tick">🎉</div>'+
        '<h1>You\'re in!</h1>'+
        '<p class="desc" style="text-align:center">'+esc(challenge.title)+'</p>'+
      '</div>'+
      '<button class="btn" id="checkin">Check in for today</button>'+
      '<p class="muted" id="cstatus"></p>'+
      '<a class="btn secondary" href="https://mood8.app/app" style="display:block;text-decoration:none;text-align:center">Get the app to save your progress</a>'
    );
    document.getElementById("checkin").addEventListener("click",function(){checkin(res);});
  }

  function checkin(res){
    var btn=document.getElementById("checkin");var st=document.getElementById("cstatus");
    btn.disabled=true;btn.textContent="Checking in…";
    fetch(API+"/challenges/"+res.challenge_id+"/checkin",{
      method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+res.token},body:"{}"
    })
    .then(function(r){if(!r.ok)return r.json().then(function(b){throw new Error(b.detail||"Check-in failed.");});return r.json();})
    .then(function(d){
      btn.textContent="Checked in ✓";
      st.textContent=d.was_on_time===false?"Logged — but past today's deadline, so no rank-up.":("You're now "+(d.rank_name||"on the board")+". Come back tomorrow!");
    })
    .catch(function(e){btn.disabled=false;btn.textContent="Check in for today";st.textContent=e.message||"Check-in failed.";});
  }
})();
</script>
</body>
</html>
